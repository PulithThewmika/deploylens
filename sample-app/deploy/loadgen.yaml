apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: deploylens
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              TARGET="${TARGET_URL:-http://frontend:8000/}"
              MIN_SLEEP="${MIN_SLEEP:-2}"
              MAX_SLEEP="${MAX_SLEEP:-5}"
              echo "loadgen -> ${TARGET} (sleep ${MIN_SLEEP}-${MAX_SLEEP}s)"
              while true; do
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$TARGET" || echo "000")
                echo "$(date -u +%H:%M:%S) $code $TARGET"
                sleep $(( RANDOM % (MAX_SLEEP - MIN_SLEEP + 1) + MIN_SLEEP ))
              done
          env:
            - name: TARGET_URL
              value: "http://frontend:8000/"
            - name: MIN_SLEEP
              value: "2"
            - name: MAX_SLEEP
              value: "5"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -sf --max-time 5 -o /dev/null http://frontend:8000/ || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
