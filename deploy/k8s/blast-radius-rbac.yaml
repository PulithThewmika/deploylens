# Read-only ServiceAccount for the detection agent's blast-radius discovery
# job (E14-T3). Applied directly to the DeployLens Kind cluster (the same
# cluster the sample app runs in) — distinct from
# deploy/helm/deploylens-agent/templates/blast-radius-rbac.yaml, which is the
# customer-side chart's equivalent for a *different*, external cluster.
#
# Apply:
#   kubectl --context kind-deploylens apply -f deploy/k8s/blast-radius-rbac.yaml
# Then mint a token with deploy/scripts/create-blast-radius-sa.sh (writes
# K8S_API_SERVER / K8S_TOKEN / K8S_CA_CERT into .env for the agent).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploylens-blast-radius
  namespace: default
---
# Long-lived token Secret (the legacy auto-mounted-token mechanism, created
# explicitly since Kubernetes 1.24+ no longer does this automatically).
# `kubectl create token` mints a short-lived (1h) token instead, which isn't
# practical for a long-running agent process — this stays valid until the
# ServiceAccount is deleted.
apiVersion: v1
kind: Secret
metadata:
  name: deploylens-blast-radius-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: deploylens-blast-radius
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploylens-blast-radius
rules:
  # Read-only, matching exactly what agent/blast_radius.py queries: the
  # list of Services (to know valid in-cluster DNS names) and Deployments
  # (to inspect container env vars for URLs referencing those names). No
  # pods/endpoints/replicasets/networkpolicies access — the discovery
  # mechanism doesn't use them, so RBAC doesn't grant them.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploylens-blast-radius
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploylens-blast-radius
subjects:
  - kind: ServiceAccount
    name: deploylens-blast-radius
    namespace: default
