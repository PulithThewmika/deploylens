# Helm values for kube-prometheus-stack in the DeployLens Kind cluster.
# Install:
#   helm install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f deploy/helm-values/kube-prometheus-stack.yaml
#
# Grafana is disabled — DeployLens runs its own provisioned Grafana
# via docker-compose (deploy/docker-compose.yml), which connects to
# this Prometheus through a port-forward.

# ── Grafana (disabled — we provision our own) ────────────────────────
grafana:
  enabled: false

# ── Prometheus ───────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Dev retention — keep it small for a Kind cluster
    retention: 7d

    # This Prometheus doubles as the "central platform" Prometheus that
    # customer-side deploylens-agent Helm charts (deploy/helm/deploylens-agent)
    # remote_write to (E15-T2 validation). Needs the receiver enabled to
    # accept those writes.
    enableRemoteWriteReceiver: true

    # Resource limits sized for a single-node Kind cluster
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

    # Pick up ServiceMonitors from ALL namespaces regardless of labels.
    # Without these false flags, only ServiceMonitors with the Helm
    # release label are discovered — the sample app's ServiceMonitors
    # (deployed by ArgoCD, not Helm) would be silently ignored.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# ── Alertmanager ─────────────────────────────────────────────────────
# Routes DeployDegradation alerts to Slack via webhook.
# The Slack URL is stored in a K8s secret (deploy/alertmanager/
# alertmanager-slack-secret.yaml) and read from the mounted file.
# See deploy/alertmanager/alertmanager.yml for the standalone reference.
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - deploylens-alertmanager-slack
      - deploylens-alertmanager-webhook
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/deploylens-alertmanager-slack/url
    route:
      receiver: "null"
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            alertname: DeployDegradation
          receiver: slack-deploylens
          continue: false
    receivers:
      - name: "null"
      - name: slack-deploylens
        slack_configs:
          - channel: "#deploylens-alerts"
            send_resolved: true
            title: >-
              {{ if eq .Status "resolved" }}:white_check_mark:{{ else }}:rotating_light:{{ end }}
              Deploy #{{ .CommonLabels.deploy_id }} — {{ .CommonLabels.service }}
            text: >-
              *Score:* {{ .CommonAnnotations.summary }}
              *Severity:* {{ .CommonLabels.severity }}
              *Evidence:* {{ .CommonAnnotations.description }}
            color: >-
              {{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}
        webhook_configs:
          - url: http://host.docker.internal:8000/api/alerts/inbound
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/deploylens-alertmanager-webhook/token

# ── kube-state-metrics (Kubernetes object metrics) ───────────────────
kubeStateMetrics:
  enabled: true

# ── node-exporter (host-level metrics) ───────────────────────────────
nodeExporter:
  enabled: true

# ── Kind-specific: control-plane components are not scrapeable ───────
# Kind runs etcd/scheduler/controller-manager with bind addresses that
# are unreachable from pods; disable their scrape targets to avoid
# permanently-down targets cluttering the targets page.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
