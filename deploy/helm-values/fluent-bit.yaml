# Helm values for Fluent-Bit in the KubeX Kind cluster.
# Install:
#   helm install fluent-bit fluent/fluent-bit \
#     -n monitoring \
#     -f deploy/helm-values/fluent-bit.yaml
#
# Ships container logs from every node to Loki via the HTTP output
# plugin (Loki's /loki/api/v1/push endpoint).

# ── Resources sized for Kind ────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# ── Fluent-Bit pipeline config ──────────────────────────────────────
config:
  # Service-level settings
  service: |
    [SERVICE]
        Daemon        Off
        Flush         5
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

  # Collect container logs from /var/log/containers
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5

  # Enrich with Kubernetes metadata (namespace, pod, container, labels)
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

  # Ship to Loki
  outputs: |
    [OUTPUT]
        Name                 loki
        Match                kube.*
        Host                 loki.monitoring.svc.cluster.local
        Port                 3100
        Labels               job=fluent-bit
        Label_Map_Path       /fluent-bit/etc/conf/labelmap.json

  # Custom label map to produce clean Loki labels
  extraFiles:
    labelmap.json: |
      {
        "kubernetes": {
          "namespace_name": "namespace",
          "pod_name": "pod",
          "container_name": "container",
          "labels": {
            "app": "app",
            "app.kubernetes.io/name": "app"
          }
        }
      }
