apiVersion: v2
name: kubex-agent
description: >-
  Customer-side data-shipping agents for KubeX — ships container logs
  (Fluent-Bit) and metrics (a bundled agent-mode Prometheus) from any
  Kubernetes cluster to a central KubeX platform, with no dependency
  on the Prometheus Operator or any other pre-installed CRDs.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - observability
  - deployment-tracking
  - monitoring
home: https://github.com/PulithThewmika/kubex
sources:
  - https://github.com/PulithThewmika/kubex
maintainers:
  - name: PulithThewmika
