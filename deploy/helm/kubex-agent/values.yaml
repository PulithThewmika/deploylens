# Default values for kubex-agent.
# Override any of these with `helm install -f my-values.yaml` or `--set`.

# ── Central platform endpoints ───────────────────────────────────────
# The central KubeX platform this cluster's data gets shipped to.
ingest:
  # Base URL of the central ingest service (used for reference/NOTES.txt
  # only — this chart doesn't call it directly, ArgoCD/CI on this cluster
  # do, using the webhook tokens below).
  url: "https://ingest.example.com"

loki:
  # Central Loki's push endpoint, reachable from this cluster. Split into
  # host/port (rather than a single URL) because Fluent-Bit's loki output
  # plugin takes them as separate fields.
  host: "loki.example.com"
  port: 3100

prometheus:
  remoteWrite:
    # Central Prometheus's remote_write endpoint.
    url: "http://prometheus.example.com:9090/api/v1/write"
  # How often the bundled agent-mode Prometheus scrapes pods in this cluster.
  scrapeInterval: 15s
  image:
    repository: prom/prometheus
    tag: v2.55.1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

fluentBit:
  image:
    repository: fluent/fluent-bit
    tag: 3.1.9
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# ── Webhook credentials ──────────────────────────────────────────────
# Shared secrets this cluster's GitHub Actions / ArgoCD Notifications need
# to authenticate to the central ingest service's webhook endpoints.
# Stored in a single Secret (<release-name>-webhook-tokens) — see
# NOTES.txt for how to reference it when wiring up ArgoCD Notifications.
webhookTokens:
  github: ""
  argocd: ""
  alertmanager: ""

# ── Blast radius ───────────────────────────────────────────────────────
# Read-only RBAC (get/list/watch on Services and Deployments only) for the
# blast-radius discovery feature (E14-T3, agent/blast_radius.py). The
# discovery job itself runs centrally (in the detection agent), not in
# this chart — this just grants the agent's ServiceAccount read access to
# this cluster's Services/Deployments so it can discover dependencies here.
blastRadius:
  enabled: true

# ── Misc ──────────────────────────────────────────────────────────────
# Applied to every resource this chart creates.
commonLabels: {}
