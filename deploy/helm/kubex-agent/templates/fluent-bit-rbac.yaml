apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "fluent-bit") }}
  labels:
    {{- include "kubex-agent.labels" . | nindent 4 }}
    {{- include "kubex-agent.selectorLabels" (dict "root" . "component" "fluent-bit") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "fluent-bit") }}
  labels:
    {{- include "kubex-agent.labels" . | nindent 4 }}
rules:
  # Read-only — needed by the kubernetes filter plugin to enrich log lines
  # with pod/namespace metadata.
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "fluent-bit") }}
  labels:
    {{- include "kubex-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "fluent-bit") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubex-agent.fullname" (dict "root" . "component" "fluent-bit") }}
    namespace: {{ .Release.Namespace }}
