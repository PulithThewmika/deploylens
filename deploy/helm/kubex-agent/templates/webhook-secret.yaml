apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "webhook-tokens") }}
  labels:
    {{- include "kubex-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  github-webhook-token: {{ .Values.webhookTokens.github | quote }}
  argocd-webhook-token: {{ .Values.webhookTokens.argocd | quote }}
  alertmanager-webhook-token: {{ .Values.webhookTokens.alertmanager | quote }}
