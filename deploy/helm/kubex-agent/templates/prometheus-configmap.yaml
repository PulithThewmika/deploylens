apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubex-agent.fullname" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "kubex-agent.labels" . | nindent 4 }}
    {{- include "kubex-agent.selectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      external_labels:
        cluster: {{ .Release.Namespace }}

    remote_write:
      - url: {{ .Values.prometheus.remoteWrite.url }}

    # Scrapes any pod annotated with prometheus.io/scrape: "true" — the
    # universal convention, deliberately chosen over ServiceMonitor CRDs so
    # this chart has no dependency on the Prometheus Operator being
    # installed in the customer's cluster.
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
