apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deploylens-agent.fullname" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "deploylens-agent.labels" . | nindent 4 }}
    {{- include "deploylens-agent.selectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "deploylens-agent.fullname" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "deploylens-agent.labels" . | nindent 4 }}
rules:
  # Read-only — needed for kubernetes_sd_configs pod discovery.
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deploylens-agent.fullname" (dict "root" . "component" "prometheus") }}
  labels:
    {{- include "deploylens-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "deploylens-agent.fullname" (dict "root" . "component" "prometheus") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "deploylens-agent.fullname" (dict "root" . "component" "prometheus") }}
    namespace: {{ .Release.Namespace }}
