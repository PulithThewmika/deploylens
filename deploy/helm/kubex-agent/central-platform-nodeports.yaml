# Exposes the central platform's Prometheus and Loki (running in the
# `kubex` Kind cluster, namespace `monitoring`) as NodePort Services
# so a *separate* Kind cluster on the same Docker network can reach them.
#
# This exists only for local validation (E15-T2) of the kubex-agent
# chart against a genuinely fresh cluster. A real deployment ships to a
# central platform with a routable endpoint (LoadBalancer/Ingress) and
# doesn't need this — it's a stand-in for "the central platform is
# reachable from the customer cluster."
#
# SECURITY: Prometheus's remote-write receiver (enabled via
# enableRemoteWriteReceiver in kube-prometheus-stack.yaml) has NO built-in
# authentication, and NodePort binds on every node's host interface, not
# just the internal cluster network — so while these Services exist,
# anything that can reach the Kind node's container IP on 30090 can write
# arbitrary metrics into the central Prometheus with forged labels, and
# anything reaching 30100 can read/write Loki, with zero auth. This is
# acceptable only because it's confined to an ephemeral local Kind
# Docker network. Never apply this manifest against a cluster reachable
# from a shared network, and delete it immediately after validation (see
# README.md's Cleanup section) rather than leaving it running.
#
# Apply against the `kubex` (central) cluster:
#   kubectl --context kind-kubex apply -f central-platform-nodeports.yaml
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport-validation
  namespace: monitoring
  labels:
    purpose: e15-t2-validation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kps-kube-prometheus-stack-prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport-validation
  namespace: monitoring
  labels:
    purpose: e15-t2-validation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100
