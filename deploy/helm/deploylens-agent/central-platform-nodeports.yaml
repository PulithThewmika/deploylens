# Exposes the central platform's Prometheus and Loki (running in the
# `deploylens` Kind cluster, namespace `monitoring`) as NodePort Services
# so a *separate* Kind cluster on the same Docker network can reach them.
#
# This exists only for local validation (E15-T2) of the deploylens-agent
# chart against a genuinely fresh cluster. A real deployment ships to a
# central platform with a routable endpoint (LoadBalancer/Ingress) and
# doesn't need this — it's a stand-in for "the central platform is
# reachable from the customer cluster."
#
# Apply against the `deploylens` (central) cluster:
#   kubectl --context kind-deploylens apply -f central-platform-nodeports.yaml
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport-validation
  namespace: monitoring
  labels:
    purpose: e15-t2-validation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kps-kube-prometheus-stack-prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport-validation
  namespace: monitoring
  labels:
    purpose: e15-t2-validation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100
