apiVersion: 1

datasources:
  # ── Prometheus (metrics from Kind cluster, port-forwarded to host) ──
  - name: Prometheus
    uid: deploylens-prometheus
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  # ── Loki (logs from Kind cluster, port-forwarded to host) ──────────
  - name: Loki
    uid: deploylens-loki
    type: loki
    access: proxy
    url: http://host.docker.internal:3100
    editable: false
    jsonData:
      maxLines: 1000

  # ── PostgreSQL (deployments, health scores, DORA views) ────────────
  - name: PostgreSQL
    uid: deploylens-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData:
      database: kubex
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: grafana_readonly
