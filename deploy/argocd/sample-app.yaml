apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.kubex: ""
    notifications.argoproj.io/subscribe.on-sync-succeeded.kubex: ""
    notifications.argoproj.io/subscribe.on-sync-failed.kubex: ""
spec:
  project: default
  source:
    repoURL: https://github.com/PulithThewmika/deploylens-sample-app.git
    targetRevision: dev
    path: deploy
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kubex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
